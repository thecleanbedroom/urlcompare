services:
  api:
    build:
      context: .
      dockerfile: packages/api-server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - PORT=3001
      - HOST=0.0.0.0
      - WEB_URL=http://127.0.0.1:3000
      # - API_KEY=change-me                       # required if the API port is exposed beyond the web proxy
      # - GOOGLE_CLIENT_ID=
      # - GOOGLE_CLIENT_SECRET=
      # - GOOGLE_REDIRECT_URI=http://127.0.0.1:3001/api/auth/google/callback
    volumes:
      - db-data:/app/db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the build — must resolve inside the compose network.
        - API_URL=http://api:3001
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
