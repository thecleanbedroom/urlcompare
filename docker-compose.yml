services:
  api:
    build:
      context: .
      dockerfile: packages/api-server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - PORT=3001
      - HOST=0.0.0.0
      - WEB_URL=http://localhost:3000
      # - API_KEY=change-me                       # required if the API port is exposed beyond the web proxy
      # - GOOGLE_CLIENT_ID=
      # - GOOGLE_CLIENT_SECRET=
      # - GOOGLE_REDIRECT_URI=http://localhost:3001/api/auth/google/callback
    volumes:
      - db-data:/app/db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the build — must resolve inside the compose network.
        - API_URL=http://api:3001
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
